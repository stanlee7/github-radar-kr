<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0b0d0c;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:#eef3ef}
.wrap{position:relative;width:1200px;height:630px}
.radar{position:absolute;right:-120px;top:50%;transform:translateY(-50%);width:640px;height:640px}
.txt{position:absolute;left:84px;top:88px;width:620px}
.kicker{display:inline-block;border:2px solid #b6ff3b;color:#b6ff3b;font-weight:800;font-size:24px;padding:6px 16px;border-radius:999px;letter-spacing:.02em}
h1{margin:30px 0 0;font-size:104px;line-height:1.02;font-weight:900;letter-spacing:-.04em}
h1 b{color:#b6ff3b}
p{margin:26px 0 0;font-size:34px;line-height:1.45;color:#c9d2cc;font-weight:700}
.url{position:absolute;left:84px;bottom:40px;font-size:24px;color:#8b968f;font-weight:700}
.url b{color:#eef3ef}
</style></head>
<body><div class="wrap">
<svg class="radar" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sweep" cx="320" cy="320" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6ff3b" stop-opacity=".55"/><stop offset="1" stop-color="#b6ff3b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#1f3a12" stroke-width="2">
    <circle cx="320" cy="320" r="300"/><circle cx="320" cy="320" r="225"/><circle cx="320" cy="320" r="150"/><circle cx="320" cy="320" r="75"/>
    <line x1="20" y1="320" x2="620" y2="320"/><line x1="320" y1="20" x2="320" y2="620"/>
  </g>
  <path d="M320 320 L320 20 A300 300 0 0 1 532 108 Z" fill="url(#sweep)"/>
  <line x1="320" y1="320" x2="532" y2="108" stroke="#b6ff3b" stroke-width="4"/>
  <g fill="#b6ff3b">
    <circle cx="430" cy="170" r="11"/><circle cx="250" cy="215" r="8" opacity=".75"/><circle cx="470" cy="390" r="9" opacity=".6"/>
    <circle cx="200" cy="430" r="7" opacity=".45"/><circle cx="360" cy="250" r="6" opacity=".9"/>
  </g>
  <circle cx="430" cy="170" r="24" fill="none" stroke="#b6ff3b" stroke-width="3" opacity=".6"/>
</svg>
<div class="txt">
  <span class="kicker">15분마다 새로 고침</span>
  <h1>깃허브<br><b>레이더</b></h1>
  <p>지금 전 세계가 별을 주는<br>깃허브 레포, 한눈에</p>
</div>
<div class="url"><b>github-radar-kr.vercel.app</b>  |  스탠리탬의 AI워크랩</div>
</div></body></html>
